name: Release candidate validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,tui,api]' ./examples/coin-game
      - run: python -m pytest -q -m 'not integration and not textual'
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,tui,api]' ./examples/coin-game
      - run: python -m pytest -q -m integration
  textual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,tui,api]' ./examples/coin-game
      - run: python -m pytest -q -m textual
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff build
      - run: ruff check evoforge tests examples
      - run: ruff format --check evoforge tests examples
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-packages
          path: dist/*
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: .venv/bin/python -m pip install '.[dev,tui,api]' ./examples/coin-game
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-validation
          path: |
            web/test-results
            web/playwright-report
