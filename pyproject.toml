[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoforge"
version = "1.0.0rc1"
description = "Universal discrete game learning with durable workers, live telemetry and terminal control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.10", "gymnasium>=1.0,<2", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "build>=1", "ruff>=0.9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30", "websockets>=13"]
viewer = ["pygame-ce>=2.5"]
gd-assets = ["Pillow>=10"]
tui = ["textual>=8,<9"]

[project.scripts]
evoforge = "evoforge.cli:main"

[tool.setuptools.packages.find]
include = ["evoforge*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["integration: real subprocess or cross-component integration", "textual: Textual pilot interaction"]

[tool.setuptools.package-data]
"evoforge.rendering" = ["assets/*.svg", "assets/*.png", "assets/*.json", "assets/*.txt"]
